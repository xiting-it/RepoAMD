version: "3.8"

services:
  repoagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: repoagent:latest
    container_name: repoagent
    network_mode: host
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ipc: host
    volumes:
      # Mount models (avoid baking 32GB into image)
      - /path/to/models:/models
      # Mount workspace (repos to analyze)
      - /path/to/workspace:/workspace
      # Persist index + sessions
      - ./.repoagent:/app/.repoagent
    environment:
      - MODEL_DIR=/models
      - REPO_PATH=/workspace/RepoAMD
    command: all
